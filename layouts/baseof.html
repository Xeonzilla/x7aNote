{{- /* Page templates may reject domain-specific content before shared head work. */ -}}
{{- block "validate" . }}{{ end -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
	<head>
		{{ partial "head.html" . }}
		{{ block "head-extra" . }}{{ end }}
	</head>
	<body{{ if or .IsPage (eq .Kind "404") }} class="is-narrow-page"{{ end }}>
		<a class="skip-link" href="#main-content">跳到正文</a>
		<main id="main-content">
			{{ block "main" . }}{{ end }}
		</main>
	</body>
</html>
