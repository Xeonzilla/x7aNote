{{- if .hook.IsBlock -}}
	<figure{{ with .presentation.ratioClass }} class="image-row-item {{ . }}"{{ end }}>
		<img
			src="{{ .image.RelPermalink }}"
			alt="{{ .hook.PlainText }}"
			width="{{ .image.Width }}"
			height="{{ .image.Height }}"
			loading="{{ .presentation.loading }}"
			{{- with .presentation.fetchPriority }}
				fetchpriority="{{ . }}"
			{{- end }}
			decoding="async">
		{{- with .hook.Title }}
			<figcaption>{{ . }}</figcaption>
		{{- end }}
	</figure>
{{- else -}}
	<img
		src="{{ .image.RelPermalink }}"
		alt="{{ .hook.PlainText }}"
		width="{{ .image.Width }}"
		height="{{ .image.Height }}"
		loading="{{ .presentation.loading }}"
		decoding="async"
		{{- with .hook.Title }}
			title="{{ . }}"
		{{- end }}>
{{- end -}}
