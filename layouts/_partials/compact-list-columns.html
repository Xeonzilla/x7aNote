{{/* Split a non-empty linear collection into compact-list columns of four; callers provide the outer grid and item renderer. */}}
{{ range seq 0 4 (sub (len .items) 1) }}
	<div class="compact-list">
		{{ range first 4 (after . $.items) }}
			{{ partial $.itemPartial . }}
		{{ end }}
	</div>
{{ end }}
