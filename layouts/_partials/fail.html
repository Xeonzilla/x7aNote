{{- /* Central project error format for LLM-readable build failures. */ -}}
{{- if not (index . "noop") -}}
	{{- errorf "%s: %s in %s. Expected: %s. Got: %s. Fix: %s."
		(index . "area")
		(index . "problem")
		(index . "location")
		(index . "expected")
		(index . "got")
		(index . "fix")
	-}}
{{- end -}}
