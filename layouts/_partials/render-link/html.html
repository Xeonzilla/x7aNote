{{- $hook := .hook -}}
{{- $link := partial "render-link/resolve.html" $hook -}}
{{- $isExternal := in (slice "http" "https") $link.scheme -}}
<a href="{{ $link.destination | safeURL }}"{{ with $hook.Title }} title="{{ . }}"{{ end }}{{ if $isExternal }} target="_blank" rel="{{ $.externalRel }}"{{ with strings.TrimSpace $hook.PlainText }} aria-label="{{ printf "%s（在新标签页打开）" . }}"{{ end }}{{ end }}>{{ $hook.Text }}</a>{{- "" -}}
